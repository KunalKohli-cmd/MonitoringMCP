# MCP Server identity
spring.ai.mcp.server.name=monitoring-mcp-server
spring.ai.mcp.server.version=0.0.1

# STDIO transport: disable web container and suppress all stdout output.
# Any non-MCP output on stdout corrupts the JSON-RPC framing.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=INFO
